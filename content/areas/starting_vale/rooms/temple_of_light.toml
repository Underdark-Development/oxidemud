name = "Temple of Light"
description = """
Sunlight streams through a stained-glass rose window, casting {brightBlue}shimmering blue{/}, {brightGreen}green{/}, {brightRed}red{/}, and {brightYellow}amber{/} patterns across the marble floor. Simple wooden pews face a white stone altar where a single candle burns. The air is cool and still, carrying a faint scent of incense.

An engraved plaque beside the door reads:
 {italic}"All who enter find rest.{/}"

The path to the {cyan}west{/} leads back to the village square.
"""

