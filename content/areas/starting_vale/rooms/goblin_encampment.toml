id = "goblin_encampment"
area = "starting_vale"
name = "Goblin Encampment"
description = """
A crude camp sprawls in a clearing behind the watchtower. A dead fire pit ringed with blackened stones smolders faintly at the center. A torn hide tent sags against a mossy boulder, and scattered animal bones lie picked clean in the mud. The reek of unwashed goblin hangs thick in the air.

A splintered trapdoor is set into the ground near the tent, half-hidden under a moldy tarp. The crack in the tower wall is still visible to the east.
"""
portals = [{keyword = "crack", dest = "ruined_watchtower", description = "A crack in the tower wall, leading back into the ruined watchtower.", flags = []}]
flags = ["no_teleport"]

