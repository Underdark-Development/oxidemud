id = "town_square"
area = "starting_vale"
name = "Village Square"
description = """
The cobblestone square of {yellow bold}Riverside Village{/} opens around you. An old stone fountain bubbles at the center, its basin carved with dancing nymphs. Flowering linden trees shade wooden benches along the edges. A weathered notice board stands near the fountain, and the distant clang of a smith's hammer mingles with birdsong.

{cyan}North{/} of here, canvas awnings shade a bustling market stall.
The {cyan}east{/} leads along a stone path toward a small temple.
The {cyan}south{/} road winds toward the village gate.
"""
exits = { north = "market_stall", east = "temple_of_light", south = "town_gate" }

[content]
[[content.mobs]]
template_id = "town_guard"
count = 2

[[content.mobs]]
template_id = "trainer"
count = 1
