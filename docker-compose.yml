services:
  oxide-server:
    build:
      context: ${OXIDE_DIR:-.}
      dockerfile: Dockerfile
    image: oxide-server:latest
    container_name: oxide-server
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "4000:4000" # MUD Telnet (Direct TCP)
      - "127.0.0.1:8080:8080" # REST API & WebSockets (Loopback only; forwarded via Cloudflare Tunnel or Caddy)
    volumes:
      - ${OXIDE_DIR:-.}/content:/app/content
      - ${OXIDE_DIR:-.}/data:/app/data
      - ${OXIDE_DIR:-.}/logs:/app/logs

  # Cloudflare Tunnel for HTTPS/WSS ingress. Only started when the 'tunnel'
  # profile is enabled, e.g. `docker compose --profile tunnel up -d` with
  # TUNNEL_TOKEN set in .env (next to this file).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
