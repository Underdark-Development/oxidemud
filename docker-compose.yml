services:
  oxide-server:
    build:
      context: ${HOME}/.oxide
      dockerfile: Dockerfile
    image: oxide-server:latest
    container_name: oxide-server
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "4000:4000" # MUD Telnet (Direct TCP)
      - "127.0.0.1:8080:8080" # REST API & WebSockets (Loopback only; forwarded via Cloudflare Tunnel or Caddy)
    volumes:
      - ${HOME}/.oxide/content:/app/content
      - ${HOME}/.oxide/data:/app/data
      - ${HOME}/.oxide/logs:/app/logs

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
