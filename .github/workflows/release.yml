# OxideMUD Manual Release
#
# Triggered manually (workflow_dispatch) with a bump level. This is the
# canonical release path:
#   1. cocogitto bumps the version (pre_bump hook updates Cargo.toml/Cargo.lock),
#      tags it (prefix-less tag, e.g. `0.4.1`), and regenerates CHANGELOG.md
#   2. The bump commit + tag are pushed to origin/main
#   3. The x86_64-unknown-linux-musl tarball is built via scripts/package.sh
#   4. A GitHub Release is published with the tarball and changelog body
#
# Deploying to the VPS is handled separately by deploy.yml, which triggers on
# `release: published`.
#
# Required repo permissions:
#   contents: write — create the tag/release and push the bump commit
#   actions: write  — dispatch the Deploy workflow (workflow_dispatch is
#                     exempt from GitHub's GITHUB_TOKEN event suppression)

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump level
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: 'Dry run: compute and print the next version only, without bumping or publishing'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  bump:
    name: Version bump (cocogitto)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pull anything that landed after the dispatch so the computed version
      # reflects the full main history. Must run before `cog bump`.
      - name: Sync with origin main
        run: git pull --rebase origin main

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bump-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bump-cargo-

      - name: Cache cocogitto
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cog-${{ runner.os }}-cocogitto
          restore-keys: cog-${{ runner.os }}-

      - name: Install cocogitto
        run: |
          if ! command -v cog >/dev/null 2>&1; then
            cargo install cocogitto --locked
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Dry-run is side-effect free: cocogitto returns before running
      # pre-bump hooks or modifying any files. It also exits non-zero when
      # there are no commits to bump, so the guard aborts with a clear message.
      # The CURRENT check catches a clone with no version tags (cog would
      # otherwise "bump" from nothing to 0.0.1).
      - name: Resolve next version (dry-run)
        id: meta
        run: |
          CURRENT=$(cog get-version 2>/dev/null | tail -n1 || true)
          NEXT=$(cog bump --${{ inputs.bump }} --dry-run 2>/dev/null || true)
          echo "current=$CURRENT next=$NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if ! [[ "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] \
             || ! [[ "$NEXT" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] \
             || [[ "$NEXT" == "$CURRENT" ]]; then
            echo "::error::Cannot resolve a clean version bump (current='${CURRENT}', next='${NEXT}'). Push feat/fix commits and make sure version tags exist on origin."
            exit 1
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: would release v${NEXT} (current v${CURRENT}). No changes were made."
          fi

      - name: Bump version
        if: inputs.dry_run == false
        run: cog bump --${{ inputs.bump }}

      # Push the tag explicitly: cocogitto creates lightweight tags, which
      # `git push --follow-tags` would silently skip.
      - name: Push bump commit and tag
        if: inputs.dry_run == false
        run: |
          git push origin main
          git push origin "${{ steps.meta.outputs.version }}"

      - name: Generate release notes
        if: inputs.dry_run == false
        run: cog changelog --at "${{ steps.meta.outputs.version }}" > release_notes.md

      - name: Upload release notes artifact
        if: inputs.dry_run == false
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
          if-no-files-found: error

  build:
    name: Package Linux musl release
    needs: bump
    runs-on: ubuntu-latest
    if: inputs.dry_run == false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.version }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-

      - name: Install zig
        run: |
          curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          sudo ln -sf /tmp/zig-x86_64-linux-0.16.0/zig /usr/local/bin/zig

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Package release
        run: ./scripts/package.sh -t ${{ env.TARGET }}

      # Fail fast if the archive name ever diverges from the packaging contract
      # (scripts/package.sh naming is matched by the website download page).
      - name: Verify artifact
        run: |
          ARCHIVE="oxide-v${{ needs.bump.outputs.version }}-${{ env.TARGET }}.tar.gz"
          test -f "target/release/$ARCHIVE"
          echo "Verified: target/release/$ARCHIVE"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-musl
          path: target/release/oxide-v${{ needs.bump.outputs.version }}-${{ env.TARGET }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [bump, build]
    runs-on: ubuntu-latest
    if: inputs.dry_run == false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage assets
        run: |
          mkdir -p assets
          cp artifacts/linux-musl/* assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump.outputs.version }}
          files: assets/*
          body_path: artifacts/release-notes/release_notes.md
          generate_release_notes: false

      # Deploy cannot be triggered by the `release` event above because GitHub
      # suppresses events created via GITHUB_TOKEN. workflow_dispatch is exempt,
      # so dispatch the Deploy workflow explicitly.
      - name: Dispatch deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml -f version=${{ needs.bump.outputs.version }} --repo ${{ github.repository }}
