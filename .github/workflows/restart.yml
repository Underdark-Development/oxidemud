# OxideMUD VPS Restart (human-initiated)
#
# The companion to deploy.yml. Deploy stages a new release on the VPS but
# never touches the running server; this workflow is the human action that
# actually restarts onto the staged version. Trigger it manually from the
# Actions tab after a release has been deployed (staged).
#
# It connects to the running server's in-container console via bounded
# `docker attach` sessions, verifies console reachability with a harmless
# `who`, builds the new image from the staged files, then
# broadcasts a 5-minute per-minute countdown to players before issuing a
# graceful shutdown through the console (watch-signal shutdown that flushes
# the database) and starting the newly staged version.
#
# Any failed broadcast or failed image build aborts BEFORE the server is
# touched, so a broken release never restarts over a missed countdown.
#
# No inputs: the version to restart onto is read from the staged
# <install-dir>/.version. Currently supports docker deploy mode only.
#
# Skipped silently unless the VPS_DEPLOY_ENABLED repo variable is 'true'.
#
# Required repo secrets (same as deploy.yml):
#   VPS_HOST        — VPS IP or hostname
#   VPS_USER        — SSH user (docker group member)
#   VPS_PORT        — SSH port (e.g. 22)
#   VPS_SSH_KEY     — private key contents (PEM) for that user

name: Restart Server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  restart:
    name: Restart server on VPS
    runs-on: ubuntu-latest
    if: vars.VPS_DEPLOY_ENABLED == 'true'
    environment: production
    env:
      INSTALL_DIR: ${{ vars.VPS_INSTALL_DIR || '$HOME/.oxidemud' }}
      DEPLOY_MODE: ${{ vars.VPS_DEPLOY_MODE || 'docker' }}
    steps:
      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Broadcast countdown and restart server
        run: |
          cat > /tmp/oxide-restart-remote.sh <<'REMOTE'
          set -euo pipefail
          INSTALL_DIR="__INSTALL_DIR__"
          DEPLOY_MODE="__DEPLOY_MODE__"
          CONTAINER="oxide-server"
          COMPOSE_FILE="$INSTALL_DIR/docker-compose.yml"
          cd "$INSTALL_DIR"


          if [ "$DEPLOY_MODE" != "docker" ]; then
            echo "ERROR: Restart Server currently supports docker mode only (VPS_DEPLOY_MODE)." >&2
            exit 1
          fi

          if ! docker compose version >/dev/null 2>&1; then
            echo "ERROR: 'docker compose' not available on VPS." >&2
            echo "Install Docker Engine + Compose plugin: https://docs.docker.com/engine/install/" >&2
            exit 1
          fi

          VERSION="$(cat "$INSTALL_DIR/.version")"
          echo "Staged version: $VERSION"

          running_container_id() {
            docker ps -q -f "name=^/${CONTAINER}$" 2>/dev/null || true
          }

          console_cmd() {
            local command="$1"
            local label="${2:-$command}"
            local container_id
            container_id="$(running_container_id)"
            if [ -z "$container_id" ]; then
              echo "ERROR: $CONTAINER is not running; cannot send console command: $label" >&2
              return 1
            fi
            echo "Sending console command: $label"
            {
              printf '%s\n' "$command"
              sleep 1
              printf '\020\021'
            } | timeout 15s docker attach --sig-proxy=false "$container_id" >/tmp/oxide-console-command.log 2>&1
          }

          echo "Verifying live server console..."
          console_cmd "who"

          # Build the new image from staged files
          echo "Building image from staged files..."
          docker compose -f "$COMPOSE_FILE" build --no-cache

          echo "Broadcasting restart countdown..."
          for minutes in 5 4 3 2 1; do
            if [ "$minutes" -eq 5 ]; then
              echo "Broadcasting 5-minute restart warning..."
              console_cmd "broadcast New server version upgrade (v$VERSION), server will restart in 5 minutes..." "broadcast 5-minute warning"
            elif [ "$minutes" -eq 1 ]; then
              echo "Broadcasting 1-minute restart warning..."
              console_cmd "broadcast Server will restart in 1 minute..." "broadcast 1-minute warning"
            else
              echo "Broadcasting $minutes-minute restart warning..."
              console_cmd "broadcast Server will restart in $minutes minutes..." "broadcast $minutes-minute warning"
            fi
            sleep 60
          done

          echo "Requesting graceful shutdown through server console..."
          OLD_CONTAINER_ID="$(running_container_id)"
          if [ -z "$OLD_CONTAINER_ID" ]; then
            echo "ERROR: $CONTAINER stopped before shutdown could be requested." >&2
            exit 1
          fi
          docker update --restart=no "$OLD_CONTAINER_ID" >/dev/null
          console_cmd "shutdown"
          sleep 1
          console_cmd "yes" "confirm shutdown"

          for i in $(seq 1 60); do
            if [ -z "$(running_container_id)" ]; then
              echo "Old oxide-server container exited cleanly."
              break
            fi
            sleep 2
          done

          if [ -n "$(running_container_id)" ]; then
            echo "ERROR: $CONTAINER did not exit after graceful shutdown request." >&2
            exit 1
          fi

          docker compose -f "$COMPOSE_FILE" rm -f -s "$CONTAINER" >/dev/null 2>&1 || true

          # Start newly built image
          echo "Starting version $VERSION..."
          docker compose -f "$COMPOSE_FILE" up -d --force-recreate "$CONTAINER"

          for i in $(seq 1 30); do
            RUNNING_CONTAINER="$(running_container_id)"
            if [ -n "$RUNNING_CONTAINER" ] && [ "$(docker inspect -f '{{.State.Running}}' "$RUNNING_CONTAINER" 2>/dev/null || echo false)" = "true" ]; then
              echo "oxide-server is running (v$VERSION)."
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: oxide-server container did not come up successfully." >&2
          exit 1




          REMOTE

          # Fill in placeholders (| sed delimiter to survive / in paths)
          sed -i \
            -e "s|__INSTALL_DIR__|${INSTALL_DIR}|g" \
            -e "s|__DEPLOY_MODE__|${DEPLOY_MODE}|g" \
            /tmp/oxide-restart-remote.sh

          ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' < /tmp/oxide-restart-remote.sh
          rm -f /tmp/oxide-restart-remote.sh
