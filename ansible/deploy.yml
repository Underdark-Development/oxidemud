---
# OxideMUD Ansible Deployment Playbook
# Dynamically parses connection details from .env and deploys precompiled binaries.

- name: Load Connection Details and Configure Inventory
  hosts: localhost
  gather_facts: false
  vars_prompt:
    - name: use_docker_prompt
      prompt: "Do you want to deploy using Docker?"
      default: "yes"
      private: false

  tasks:
    - name: Parse Docker deploy decision
      ansible.builtin.set_fact:
        use_docker: "{{ use_docker_prompt | lower in ['yes', 'y', 'true', '1'] }}"

    - name: Check if .env file exists in root directory
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../.env"
      register: dotenv_root

    - name: Check if .env file exists in ansible directory
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/.env"
      register: dotenv_ansible
      when: not dotenv_root.stat.exists

    - name: Set path to .env file
      ansible.builtin.set_fact:
        dotenv_path: "{{ playbook_dir }}/../.env"
      when: dotenv_root.stat.exists

    - name: Fallback to ansible/.env path if set
      ansible.builtin.set_fact:
        dotenv_path: "{{ playbook_dir }}/.env"
      when: dotenv_path is not defined and dotenv_ansible is defined and dotenv_ansible.stat.exists

    - name: Fail if no .env file is found
      ansible.builtin.fail:
        msg: "No connection configuration file found. Copy ansible/.env.example to .env in root or ansible/."
      when: dotenv_path is not defined

    - name: Read .env file content
      ansible.builtin.slurp:
        src: "{{ dotenv_path }}"
      register: dotenv_raw

    - name: Parse environment variables
      ansible.builtin.set_fact:
        dotenv_vars: "{{ dotenv_vars | default({}) | combine({ item.split('=', 1)[0] | trim: item.split('=', 1)[1] | trim }) }}"
      loop: "{{ (dotenv_raw['content'] | b64decode).splitlines() }}"
      when:
        - item | trim is not none
        - item | trim != ''
        - not item.startswith('#')
        - "'=' in item"

    - name: Validate connection parameters
      ansible.builtin.fail:
        msg: "Missing required parameter '{{ item }}' in .env configuration."
      loop:
        - VPS_HOST
        - VPS_USER
        - VPS_PORT
        - VPS_KEY_PATH
      when: dotenv_vars[item] is not defined or dotenv_vars[item] == ''

    - name: Define host in in-memory inventory
      ansible.builtin.add_host:
        name: "{{ dotenv_vars.VPS_HOST }}"
        groups: remote_vps
        ansible_user: "{{ dotenv_vars.VPS_USER }}"
        ansible_port: "{{ dotenv_vars.VPS_PORT | int }}"
        ansible_ssh_private_key_file: "{{ dotenv_vars.VPS_KEY_PATH }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
        # Configs passed as host variables
        install_dir: "{{ dotenv_vars.INSTALL_DIR | default('/opt/oxide') }}"
        run_as_user: "{{ dotenv_vars.RUN_AS_USER | default('oxide') }}"
        install_game_service: "{{ dotenv_vars.INSTALL_GAME_SERVICE | default('true') | bool }}"
        install_mcp_service: "{{ dotenv_vars.INSTALL_MCP_SERVICE | default('true') | bool }}"

- name: Deploy Precompiled Release to Remote VPS
  hosts: remote_vps
  gather_facts: true
  vars:
    use_docker: "{{ hostvars['localhost']['use_docker'] }}"
  tasks:
    - name: Ensure target precompiled binaries directory exists locally
      delegate_to: localhost
      become: false
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../bin"
      register: local_bin_dir

    - name: Fail if precompiled binaries are missing
      delegate_to: localhost
      become: false
      ansible.builtin.fail:
        msg: "Precompiled binaries directory 'bin/' not found. Please compile the binaries or run this script from the unpacked distribution package folder."
      when: not local_bin_dir.stat.exists or not local_bin_dir.stat.isdir

    - name: Create temporary staging directory remote
      ansible.builtin.file:
        path: "/tmp/oxide_deploy"
        state: directory
        mode: '0755'

    - name: Copy deployment files to remote VPS
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item.src }}"
        dest: "/tmp/oxide_deploy/{{ item.dest }}"
        mode: "{{ item.mode | default('0644') }}"
      loop:
        - { src: "bin/", dest: "bin/" }
        - { src: "content/", dest: "content/" }
        - { src: "install.sh", dest: "install.sh", mode: "0755" }
        - { src: "Dockerfile", dest: "Dockerfile" }
        - { src: "docker-compose.yml", dest: "docker-compose.yml" }
        - { src: ".dockerignore", dest: ".dockerignore" }

    - name: Stop host systemd services if using Docker
      become: true
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - oxide-server
        - oxide-mcp
      failed_when: false
      when: use_docker

    - name: Run Remote installer (non-Docker setup)
      become: true
      ansible.builtin.command:
        cmd: >
          ./install.sh
          --install-dir "{{ install_dir }}"
          --user "{{ run_as_user }}"
          --install-game-service "{{ install_game_service | string | lower }}"
          --install-mcp-service "{{ install_mcp_service | string | lower }}"
        chdir: "/tmp/oxide_deploy"
      register: installer_out
      changed_when: true
      when: not use_docker

    - name: Run Remote installer (Docker setup directory structures)
      become: true
      ansible.builtin.command:
        cmd: >
          ./install.sh
          --install-dir "{{ install_dir }}"
          --user "{{ run_as_user }}"
          --install-game-service "false"
          --install-mcp-service "false"
        chdir: "/tmp/oxide_deploy"
      register: installer_docker_out
      changed_when: true
      when: use_docker

    - name: Copy Docker deployment files to installation directory
      become: true
      ansible.builtin.copy:
        src: "/tmp/oxide_deploy/{{ item }}"
        dest: "{{ install_dir }}/{{ item }}"
        remote_src: true
        mode: '0644'
        owner: "{{ run_as_user }}"
      loop:
        - Dockerfile
        - docker-compose.yml
        - .dockerignore
      when: use_docker

    - name: Start server services via Docker Compose
      become: true
      ansible.builtin.command:
        cmd: "docker-compose up -d --build"
        chdir: "{{ install_dir }}"
      register: docker_compose_out
      changed_when: true
      when: use_docker

    - name: Output non-Docker installation details
      ansible.builtin.debug:
        var: installer_out.stdout_lines
      when: not use_docker

    - name: Output Docker setup details
      ansible.builtin.debug:
        var: installer_docker_out.stdout_lines
      when: use_docker

    - name: Output Docker Compose start details
      ansible.builtin.debug:
        var: docker_compose_out.stdout_lines
      when: use_docker and docker_compose_out is defined

    - name: Remote cleanup
      ansible.builtin.file:
        path: "/tmp/oxide_deploy"
        state: absent
