[package]
name = "oxide-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
oxide-core = { path = "../core" }
oxide-data = { path = "../data" }
tokio = { version = "1", features = ["net", "io-util", "macros", "sync", "time", "rt"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
fastrand = "2"
