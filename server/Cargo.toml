[package]
name = "oxide-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
oxide-core = { path = "../core" }
oxide-data = { path = "../data" }
oxide-ws-mcp = { path = "../ws-mcp" }
rmcp = { version = "1.7", features = ["server", "client", "macros", "transport-io"] }
tokio = { version = "1", features = ["net", "io-util", "macros", "sync", "time", "rt"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
fastrand = "2"
axum = { version = "0.7", features = ["macros", "ws"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
notify = "6.1.1"
rcgen = "0.13"
rustls-pemfile = "2"
tokio-rustls = "0.26"
tokio-tungstenite = "0.26"
sysinfo = "0.30"
schemars = "1"

