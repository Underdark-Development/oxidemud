[package]
name = "oxide-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
oxide-core = { path = "../core" }
oxide-server = { path = "../server" }
oxide-data = { path = "../data" }
oxide-scripting = { path = "../scripting" }
tokio = { version = "1", features = ["net", "io-util", "macros", "sync", "rt-multi-thread", "signal", "io-std"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40", features = ["bundled"] }
