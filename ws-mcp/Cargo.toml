[package]
name = "oxide-ws-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rmcp = { version = "1.7", features = ["server", "client", "macros", "transport-io"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-util", "net"] }
thiserror = "2"